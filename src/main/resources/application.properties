#quarkus.langchain4j.openai.base-url=http://localhost:1234/v1
#quarkus.langchain4j.openai.chat-model.model-name=ibm/granite-4-h-tiny
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:demo}

quarkus.langchain4j.mcp.netatmo.transport-type=streamable-http
quarkus.langchain4j.mcp.netatmo.url=http://localhost:8091/mcp
#quarkus.langchain4j.mcp.netatmo.url=https://netatmo-kdubois1-dev.apps.rm3.7wse.p1.openshiftapps.com/mcp/sse

# Admin MCP client — connects to the secured /admin/mcp endpoint using OIDC
quarkus.langchain4j.mcp.netatmo-admin.transport-type=streamable-http
quarkus.langchain4j.mcp.netatmo-admin.url=http://localhost:8091/admin/mcp
quarkus.langchain4j.mcp.netatmo-admin.auto-health-check=false

# OIDC client for acquiring admin tokens from Keycloak (alice has admin role)
# auth-server-url is auto-configured by Keycloak Dev Services in dev mode
quarkus.oidc-client.client-id=quarkus-app
quarkus.oidc-client.credentials.secret=secret
quarkus.oidc-client.grant.type=password
quarkus.oidc-client.grant-options.password.username=alice
quarkus.oidc-client.grant-options.password.password=alice

# Keycloak Dev Services — must match netatmo's config so the shared container has correct roles
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.5.7
quarkus.keycloak.devservices.realm-name=quarkus
quarkus.keycloak.devservices.roles.alice=admin,user
quarkus.keycloak.devservices.roles.bob=user

# General timeout settings for better error handling
quarkus.langchain4j.timeout=PT30S
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=false

quarkus.http.port=8080