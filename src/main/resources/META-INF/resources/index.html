<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" type="image/png" href="favicon.ico">

    <script src="/_importmap/dynamic-importmap.js"></script>

    <script type="module">
        import 'icons/font-awesome.js';
        import 'components/chatbot-title.js';
        import 'components/chatbot-chat.js';
    </script>

    <link rel="stylesheet" href="fonts/red-hat-font.min.css">

    <title>HomeBot</title>

    <style>
        :root {
            --main-bg-color: rgb(246, 242, 242);
            --main-highlight-text-color: rgba(237, 98, 128);
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Red Hat Text', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem;
            color: var(--lumo-body-text-color);
            background: var(--main-bg-color);
        }

        chatbot-title {
            width: 100%;
            flex-shrink: 0;
        }

        .chat-area {
            flex: 1;
            width: 560px;
            max-width: 90%;
            margin: 0.75rem auto 1rem;
            min-height: 0;
            display: flex;
        }

        chatbot-chat {
            width: 100%;
        }
    </style>
</head>

<body>

<chatbot-title></chatbot-title>

<div class="chat-area">
    <chatbot-chat></chatbot-chat>
</div>

</body>

</html>
